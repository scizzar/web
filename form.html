<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        <table>
            <tr>
                <td>
                    Username
                </td>
                <td><input type="text" name="" id="" placeholder="username" pattern="[A-Za-z]+"></td>
            </tr>
            <tr>
                <td>
                    Password
                </td>
                <td><input type="password" name="" id="" placeholder="password" pattern="[A-Za-z0-9]{6,15}"></td>
            </tr>
            <tr>
                <td>Umur</td>
                <td><input type="number" min="18" max="100" placeholder="umur"> </td>
                
            </tr>
            <tr>
                <td>Jenis kelamin</td>
                <td>
                    <input type="radio" name="gender" id="" value="pria" checked>Pria
                    <input type="radio" name="gender" id="" value="wanita">Wanita
                </td>
            </tr>
            <tr>
                <td>Alamat</td>
                <td><textarea name="" id="" rows="4" cols="30" placeholder="alamat"></textarea></td>
            </tr>
            <tr>
                <td>
                    Tanggal Lahir
                </td>
                <td><input type="date" name="" id=""></td>
            </tr>
            <tr>
                <td>Jurusan</td>
                <td>
                    <select name="jurusan">
                        <optgroup label="FTD">
                            <option value="TI">Teknik Informatika</option>
                            <option value="SK">Sistem Komputer</option>
                            <option value="DKV">DKV</option>
                        </optgroup>
                        <optgroup label="FEB">
                            <option value="Ak">Akutansi</option>
                            <option value="MAN">Manajemen</option>
                            
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" name="" id="" >
                </td>
                <td><input type="reset" name="" id="" ></td>
            </tr>
        </table>
    </form>
</body>
</html>
